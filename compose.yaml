services:

  postgres:
    image: postgres:17

    container_name: social-media-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: social_media_analytics
      POSTGRES_USER: social_media_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U social_media_app -d social_media_analytics"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: